# BioTrace GitHub Actions workflow reference template.
#
# Generated by `biotrace::write_biotrace_workflow()` with default
# arguments. Edit the inputs in the `with:` block as needed; the
# upstream action.yml documents every accepted input.
#
# This workflow uses the upstream Action directly:
#   uses: rotsl/biotrace@v1
# It never references this R package as an Action, because `biotrace`
# is an R package, not a GitHub Action repository.
name: BioTrace

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  biotrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: biotrace
        uses: rotsl/biotrace@v1
        with:
          config: .github/biotrace.yml
          github-token: ${{ github.token }}
          fail-on: error
          ai-enabled: "false"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: biotrace-report
          path: ${{ steps.biotrace.outputs.report-path }}
